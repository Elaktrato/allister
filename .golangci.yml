# golangci-lint v2 configuration. The version and image digest are pinned in
# scripts/ci.sh (see PINS.md); run it with `scripts/ci.sh lint`.
#
# The set is deliberately small: correctness and security linters plus the
# formatters. Every exclusion below carries its reason; prefer a narrow
# `//nolint:<linter> // <reason>` at the line over a new global exclusion.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # A deferred Rollback after Commit returns sql.ErrTxDone; on the
        # error paths the error that caused the rollback is the one returned.
        - (*database/sql.Tx).Rollback
        # A failed write to the client means the client went away; there is
        # nothing left to report it to.
        - (net/http.ResponseWriter).Write
        # best-effort removal of an upload's temporary files
        - (*mime/multipart.Form).RemoveAll
    errorlint:
      # The code wraps exactly one sentinel (ErrUnavailable, ErrBadResponse,
      # ErrRetryLater, ...) with %w and formats the underlying cause with %v on
      # purpose: callers classify errors by the sentinel only, and the cause
      # (a net or JSON error) must not become matchable. The comparison and
      # type-assertion checks stay on.
      errorf: false
    gosec:
      excludes:
        # G104 (unhandled errors) duplicates errcheck, which is configured above
        - G104
    # misspell runs without a locale: the code and docs use British spelling
    # ("cancelled" is also a stored import state).
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
    staticcheck:
      checks:
        - all
        # the defaults of golangci-lint v2 (doc comment and naming style)
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # "could apply De Morgan's law": a readability preference; the
        # negated forms in this code mirror the rule they implement.
        - -QF1001
  exclusions:
    presets:
      # unchecked Close, Remove/RemoveAll, Flush and fmt.Print*: cleanup in
      # defers and best-effort removal of temporary files
      - std-error-handling
    rules:
      # Tests: an unchecked setup error surfaces as a failed assertion;
      # fixtures read and write temporary files and build SQL from constant
      # table names; sentinel comparisons with == assert that an API returns
      # the sentinel itself, unwrapped.
      - path: _test\.go
        linters:
          - errcheck
          - errorlint
          - gosec
      # Every request-derived value (URL path, search query) is logged with
      # %q, which escapes newlines and control characters; gosec's taint
      # analysis (G706) does not look at the verb.
      - linters:
          - gosec
        text: "G706:"

formatters:
  enable:
    - gofmt
    - goimports
