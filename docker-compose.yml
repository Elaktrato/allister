services:
  allister:
    build: .
    ports:
      # Host port and listen port are both PORT (default 8080):
      #   PORT=9000 docker compose up -d
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      DATA_DIR: /data
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:-}"
    volumes:
      # SQLite database (allister.db) and covers/ live here.
      - allister-data:/data
    restart: unless-stopped
    # Time on stop to drain open requests (up to 10 s) and then hand the
    # running background job back to the queue cleanly; the default 10 s
    # could kill the process during the drain.
    stop_grace_period: 30s
    # No healthcheck: the runtime image is distroless (no shell, curl or wget).
    # GET /healthz answers "ok" for an external monitor.

volumes:
  allister-data:
