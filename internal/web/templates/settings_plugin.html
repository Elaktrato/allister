{{define "title"}}{{.Name}} settings - Allister{{end}}
{{define "content"}}
<div class="md:flex md:items-start md:gap-8">
  {{settingsTabsMarker}}
  <div class="min-w-0 flex-1">
    <p class="mb-1 text-sm"><a href="/settings/plugins" class="text-slate-400 hover:text-slate-200 hover:underline">Plugins</a></p>
    <h1 class="mb-6 text-2xl font-semibold">{{.Name}} <span class="text-base font-normal {{if .Enabled}}text-emerald-400{{else}}text-slate-500{{end}}">{{if .Enabled}}enabled{{else}}disabled{{end}}</span></h1>
    <section aria-labelledby="title-language-heading" class="mb-8 max-w-md rounded-lg border border-slate-800 bg-slate-900/40 p-4">
      <h2 id="title-language-heading" class="mb-1 font-semibold">Title language</h2>
      <p class="mb-3 text-sm text-slate-400">Titles of this plugin's entries are shown in this language when an entry has it.</p>
      <form method="post" action="{{.LangAction}}" class="flex flex-wrap items-center gap-3">
        <label for="title_lang" class="sr-only">Title language</label>
        <select id="title_lang" name="title_lang" class="min-w-0 flex-1 rounded-md border border-slate-700 bg-slate-900 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          {{range .LangOptions}}<option value="{{.Value}}"{{if eq .Value $.Lang}} selected{{end}}>{{.Label}}</option>
          {{end}}
        </select>
        <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">Save</button>
      </form>
    </section>
  </div>
</div>
{{end}}
