{{define "list_row"}}
<tr data-row class="border-b border-slate-800 align-middle">
  <td class="w-14 py-2 pr-3">
    {{if .Cover}}<img src="{{.Cover}}" alt="" loading="lazy" class="h-20 w-14 rounded object-cover">
    {{else}}<span class="block h-20 w-14 rounded bg-slate-800" aria-hidden="true"></span>{{end}}
  </td>
  <td class="min-w-40 py-2 pr-3">
    <a href="{{.Href}}" class="font-medium text-indigo-300 hover:underline">{{.Title}}</a>
    <div class="mt-1 flex flex-wrap gap-1 text-xs">
      {{if .PartialSync}}<span title="Some details (cast, images) are still being fetched in the background" class="rounded bg-slate-800 px-2 py-0.5 text-amber-300">partially synced</span>{{end}}
      {{if .Unmatch}}<span title="Added manually; no AniList match yet" class="rounded bg-slate-800 px-2 py-0.5 text-sky-300">unmatched</span>{{end}}
    </div>
  </td>
  <td class="hidden py-2 pr-3 text-slate-300 sm:table-cell">{{.Type}}</td>
  <td class="py-2 pr-3 whitespace-nowrap">
    <span class="inline-flex items-center gap-2">
      <span>{{.Progress}} / {{.Total}}</span>
      {{if not .AtTotal}}
      <form method="post" action="{{.IncrementURL}}" hx-post="{{.IncrementURL}}" hx-target="closest tr" hx-swap="outerHTML" class="inline">
        <input type="hidden" name="return" value="{{.Return}}">
        <button type="submit" class="rounded bg-slate-800 px-2 py-0.5 text-sm hover:bg-slate-700" aria-label="Add one episode to {{.Title}}">+1</button>
      </form>
      {{end}}
    </span>
  </td>
  <td class="py-2 pr-3" data-score="{{.ScoreAttr}}">{{.Score}}</td>
  <td class="py-2 pr-3 whitespace-nowrap">{{.Status}}</td>
  <td class="py-2 text-right whitespace-nowrap">
    <a href="{{.EditURL}}" hx-get="{{.EditURL}}" hx-target="#dialog-slot" hx-swap="innerHTML" class="mr-2 text-indigo-300 hover:underline">Edit</a>
    <form method="post" action="{{.RemoveURL}}" hx-post="{{.RemoveURL}}" hx-confirm="Remove this anime and all its saved details from your list?" class="inline">
      <input type="hidden" name="return" value="{{.Return}}">
      <button type="submit" class="text-red-300 hover:underline">Remove</button>
    </form>
  </td>
</tr>
{{end}}
