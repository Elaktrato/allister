{{define "title"}}Add manually - Allister{{end}}
{{define "content"}}
<h1 class="mb-6 text-2xl font-semibold">Add anime manually</h1>
<form method="post" action="/anime/manual/new" enctype="multipart/form-data" class="max-w-2xl space-y-4">
  {{if .Error}}
  <div class="rounded border border-amber-700 bg-amber-950 p-3 text-amber-200" role="alert"><p>{{.Error}}</p></div>
  {{end}}
  <label class="block text-sm">Title
    <input type="text" name="title" value="{{.Title}}" required maxlength="300" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
  </label>
  <div class="grid gap-3 sm:grid-cols-2">
    <label class="block text-sm">Title language
      <select name="title_lang" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
        {{$cur := .TitleLang}}{{range .Langs}}<option value="{{.Value}}"{{if eq .Value $cur}} selected{{end}}>{{.Label}}</option>{{end}}
      </select>
    </label>
    <label class="block text-sm">Type
      <select name="type" required class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
        <option value=""{{if not .Type}} selected{{end}} disabled>Choose a type</option>
        {{$t := .Type}}{{range .Types}}<option value="{{.Value}}"{{if eq .Value $t}} selected{{end}}>{{.Label}}</option>{{end}}
      </select>
    </label>
  </div>
  <div class="grid gap-3 sm:grid-cols-3">
    <label class="block text-sm">Episodes
      <input type="number" min="1" max="10000" step="1" name="episodes" value="{{.EpisodesIn}}" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
    </label>
    <label class="block text-sm">Year
      <input type="number" min="1900" max="2100" step="1" name="year" value="{{.Year}}" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
    </label>
    <label class="block text-sm">Studio
      <input type="text" name="studio" value="{{.Studio}}" maxlength="200" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
    </label>
  </div>
  <label class="block text-sm">Synopsis
    <textarea name="synopsis" rows="5" maxlength="5000" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">{{.Synopsis}}</textarea>
  </label>
  {{if .CoversEnabled}}
  <label class="block text-sm">Cover image (JPEG, PNG, WebP or GIF, up to 10 MiB)
    <input type="file" name="cover" accept="image/jpeg,image/png,image/webp,image/gif" class="mt-1 block w-full text-slate-300">
  </label>
  {{if .FileDropped}}<p class="text-sm text-amber-300">Your browser cannot keep the selected cover file: please choose it again.</p>{{end}}
  {{end}}

  <h2 class="pt-2 text-lg font-semibold">Your list entry</h2>
  <label class="block text-sm">Status
    <select name="status" required class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
      {{range .Statuses}}<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>{{end}}
    </select>
  </label>
  <div class="grid grid-cols-2 gap-3">
    <label class="block text-sm">Rating
      <input type="number" min="0" max="10" step="1" name="rating" value="{{.Rating}}" placeholder="0–10" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
    </label>
    <label class="block text-sm">Progress
      <input type="number" min="0" step="1" name="progress" value="{{.Progress}}" placeholder="0" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
    </label>
    <label class="block text-sm">Started
      <input type="date" name="started_on" value="{{.StartedOn}}" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
    </label>
    <label class="block text-sm">Finished
      <input type="date" name="finished_on" value="{{.FinishedOn}}" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">
    </label>
  </div>
  <label class="block text-sm">Comment
    <textarea name="comment" rows="3" maxlength="2000" class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2">{{.Comment}}</textarea>
  </label>
  <div class="flex justify-end gap-3">
    <a href="/anime" class="rounded px-4 py-2 hover:bg-slate-800">Cancel</a>
    <button type="submit" class="rounded bg-indigo-600 px-4 py-2 font-medium hover:bg-indigo-500">Add</button>
  </div>
</form>
{{end}}
