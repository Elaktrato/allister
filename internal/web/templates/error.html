{{define "title"}}{{.Title}} - Allister{{end}}
{{define "content"}}
<div class="max-w-2xl rounded border border-amber-700 bg-amber-950 p-4 text-amber-200" role="alert">
  <h1 class="mb-2 text-xl font-semibold">{{.Title}}</h1>
  <p>{{.Message}}</p>
  {{if .RetryURL}}<a href="{{.RetryURL}}" class="mt-3 inline-block rounded bg-indigo-600 px-3 py-1 font-medium text-white hover:bg-indigo-500">Try again</a>{{end}}
</div>
{{end}}
