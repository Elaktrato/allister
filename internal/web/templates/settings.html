{{define "title"}}Settings - Allister{{end}}
{{define "content"}}
<h1 class="mb-6 text-2xl font-semibold">Settings</h1>
<form method="post" action="/settings" class="flex max-w-md flex-col gap-4">
  <label for="title_lang" class="text-sm font-medium text-slate-300">Title language</label>
  <select id="title_lang" name="title_lang" class="w-full rounded border border-slate-700 bg-slate-900 px-3 py-2">
    {{range .Options}}<option value="{{.Value}}"{{if eq .Value $.Selected}} selected{{end}}>{{.Label}}</option>
    {{end}}
  </select>
  <button type="submit" class="self-start rounded bg-indigo-600 px-4 py-2 font-medium hover:bg-indigo-500">Save</button>
</form>
{{end}}
