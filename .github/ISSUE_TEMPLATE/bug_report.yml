name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /anime\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings > General shows it (or GET /version).
      placeholder: v0.1.0 (0123456, 2026-11-10)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines of `docker compose logs`. Remove anything private.
      render: text
