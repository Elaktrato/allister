# Dependabot version updates, grouped weekly so the tree sees one pull
# request per ecosystem instead of one per dependency. Digest pins (images)
# and commit SHA pins (actions) are updated in place, with the version
# comment. A cooldown skips releases younger than a week (a compromised
# release is usually caught within days). After merging an update, refresh
# PINS.md (scripts/update-pins.sh --write for images; the actions table by
# hand) — the guard tests fail until it is in step.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
