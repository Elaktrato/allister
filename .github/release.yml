# Categories of the generated release notes (gh release create
# --generate-notes), by pull request label. Label pull requests after their
# Conventional Commit prefix (feat, fix, docs, build/ci, test); Dependabot's
# updates carry the "dependencies" label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Build and CI
      labels:
        - build
        - ci
        - test
    - title: Other changes
      labels:
        - "*"
